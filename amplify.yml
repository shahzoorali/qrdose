# AWS Amplify Hosting build settings for the QRdose Next.js app.
# Set environment variables (AWS creds, DYNAMODB_TABLE, AUTH_SECRET, Stripe,
# APP_BASE_URL, etc.) in the Amplify console, not here.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
